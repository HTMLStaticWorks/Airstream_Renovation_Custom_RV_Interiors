<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Page Not Found | Airstream RV</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />
  <style>
    html, body { height: 100%; }
    .error-deco {
      position: absolute;
      width: 800px; height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196,122,44,0.08) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .error-links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: var(--space-5);
    }
    .quick-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: var(--space-4);
    }
    .quick-nav a {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      transition: var(--transition);
    }
    .quick-nav a:hover {
      background: rgba(196,122,44,0.2);
      border-color: var(--color-accent);
      color: var(--color-secondary);
    }
    .rv-animation {
      font-size: 4rem;
      animation: drive 3s linear infinite;
      display: inline-block;
      margin: var(--space-3) 0;
    }
    @keyframes drive {
      0% { transform: translateX(-30px); }
      50% { transform: translateX(30px); }
      100% { transform: translateX(-30px); }
    }
  </style>
</head>
<body>

<!-- Top-right controls -->
<div class="auth-page-controls">
  <button class="control-btn" data-rtl-toggle aria-label="Toggle RTL"><i class="ri-layout-left-2-line"></i></button>
  <button class="control-btn" data-theme-toggle aria-label="Toggle dark mode"><i class="ri-moon-line"></i></button>
</div>

<main class="error-page" role="main">
  <div class="error-deco" aria-hidden="true"></div>
  <div class="error-content" style="position:relative;z-index:1;text-align:center;padding:var(--space-4)">
    <div class="error-code" aria-label="Error 404">404</div>
    <div class="rv-animation" aria-hidden="true"><i class="ri-roadster-fill"></i></div>
    <h2>Looks Like You Took a Wrong Turn</h2>
    <p style="color:rgba(255,255,255,0.6);max-width:440px;margin:var(--space-2) auto 0">
      The page you're looking for doesn't exist or has been moved. Let's get you back on the road.
    </p>
    <div class="error-links">
      <a href="../index.html" class="btn btn-primary btn-lg">
        <i class="ri-home-3-line"></i> Back to Home
      </a>
      <a href="contact.html" class="btn btn-secondary btn-lg" style="border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.8)">
        <i class="ri-customer-service-2-line"></i> Contact Us
      </a>
    </div>
    <nav class="quick-nav" aria-label="Quick navigation">
      <a href="services.html">Services</a>
      <a href="about.html">About Us</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</main>

<script src="../assets/js/main.js"></script>
</body>
</html>
