<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | Airstream Renovation & Custom RV Interiors</title>
  <meta name="description" content="Create your free Airstream RV client account to track your project, manage invoices, and stay connected with your renovation team." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />
  <style>
    .auth-bg-deco { position:fixed; inset:0; background:linear-gradient(135deg,var(--bg-secondary) 0%,var(--bg-primary) 100%); z-index:0; }
    .auth-bg-deco::before { content:''; position:absolute; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle,rgba(196,122,44,0.08) 0%,transparent 70%); top:-100px; right:-100px; }
    .pass-toggle { position:relative; }
    .pass-toggle input { padding-right:48px; }
    .pass-toggle button { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-light); cursor:pointer; font-size:1rem; transition:var(--transition); display:flex; align-items:center; }
    .pass-toggle button:hover { color:var(--color-accent); }
    .password-strength { height:4px; border-radius:2px; background:var(--border-color); margin-top:6px; overflow:hidden; }
    .password-strength-bar { height:100%; width:0; border-radius:2px; transition:all 0.3s ease; }
    .strength-text { font-size:0.75rem; margin-top:4px; }
  </style>
</head>
<body>

<!-- NO HEADER -->
<div class="auth-page-controls">
  <button class="control-btn" data-rtl-toggle aria-label="Toggle RTL">RTL <i class="ri-layout-left-2-line"></i></button>
  <button class="control-btn" data-theme-toggle aria-label="Toggle dark mode"><i class="ri-moon-line"></i></button>
</div>

<div class="auth-bg-deco" aria-hidden="true"></div>

<main class="auth-page" style="padding:var(--space-6) var(--space-3);" role="main">
  <div class="auth-card" style="max-width:480px" role="region" aria-labelledby="register-heading">

    <!-- Brand inside card -->
    <div class="auth-brand">
      <a href="index.html" class="header-logo" aria-label="Back to homepage">
        <div class="logo-icon" aria-hidden="true"><i class="ri-roadster-line"></i></div>
        <div class="logo-text">
          <span class="brand-name">Airstream RV</span>
          <span class="brand-sub">Custom Interiors</span>
        </div>
      </a>
      <div>
        <h1 id="register-heading" style="font-size:1.5rem;margin-bottom:4px">Create Your Account</h1>
        <p style="font-size:0.875rem">Join the Airstream RV client portal</p>
      </div>
    </div>

    <!-- Register Form -->
    <form id="register-form" data-validate novalidate aria-label="Registration form">
      <div class="form-group">
        <label for="reg-name">Full Name <span style="color:#e74c3c" aria-hidden="true">*</span></label>
        <input type="text" id="reg-name" name="name" class="form-control" placeholder="Jane Smith" data-rules="required" required aria-required="true" autocomplete="name" />
        <span class="form-error" role="alert"></span>
      </div>
      <div class="form-group">
        <label for="reg-email">Email Address <span style="color:#e74c3c" aria-hidden="true">*</span></label>
        <input type="email" id="reg-email" name="email" class="form-control" placeholder="jane@example.com" data-rules="required,email" required aria-required="true" autocomplete="email" />
        <span class="form-error" role="alert"></span>
      </div>
      <div class="form-group">
        <label for="reg-password">Password <span style="color:#e74c3c" aria-hidden="true">*</span></label>
        <div class="pass-toggle">
          <input type="password" id="reg-password" name="password" class="form-control" placeholder="Create a strong password" data-rules="required,password" required aria-required="true" autocomplete="new-password" />
          <button type="button" aria-label="Toggle password visibility" id="toggle-reg-pass"><i class="ri-eye-line"></i></button>
        </div>
        <div class="password-strength" role="progressbar" aria-label="Password strength" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="password-strength-bar" id="strength-bar"></div>
        </div>
        <span class="strength-text" id="strength-text" style="color:var(--text-light)">At least 8 characters</span>
        <span class="form-error" role="alert"></span>
      </div>
      <div class="form-group">
        <label for="reg-confirm">Confirm Password <span style="color:#e74c3c" aria-hidden="true">*</span></label>
        <div class="pass-toggle">
          <input type="password" id="reg-confirm" name="confirm" class="form-control" placeholder="Repeat your password" data-rules="required" required aria-required="true" autocomplete="new-password" />
          <button type="button" aria-label="Toggle confirm password visibility" id="toggle-confirm-pass"><i class="ri-eye-line"></i></button>
        </div>
        <span class="form-error" role="alert"></span>
      </div>

      <!-- Terms Checkbox (Mandatory) -->
      <div class="checkbox-group" style="margin-bottom:var(--space-1)">
        <input type="checkbox" id="terms" name="terms" required aria-required="true" />
        <label for="terms">I agree to the <a href="#" target="_blank">Terms of Service</a> and <a href="#" target="_blank">Privacy Policy</a> <span style="color:#e74c3c" aria-hidden="true">*</span></label>
      </div>
      <div class="checkbox-group" style="margin-bottom:var(--space-3)">
        <input type="checkbox" id="newsletter-opt" name="newsletter" />
        <label for="newsletter-opt">Send me renovation tips and exclusive offers</label>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        <i class="ri-user-add-line"></i> Create Account
      </button>
    </form>

    <div class="auth-divider"><span>or sign up with</span></div>

    <button class="oauth-btn" type="button" aria-label="Continue with Apple">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
      Continue with Apple
    </button>
    <button class="oauth-btn" type="button" aria-label="Continue with Email">
      <i class="ri-mail-line" style="font-size:1.1rem"></i>
      Continue with Email
    </button>

    <p class="auth-footer-text">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
    <p class="auth-footer-text" style="margin-top:4px">
      <a href="index.html" style="color:var(--text-light);font-size:0.8rem"><i class="ri-arrow-left-line"></i> Back to website</a>
    </p>
  </div>
</main>

<script src="../assets/js/main.js"></script>
<script>
  // Password toggles
  [['toggle-reg-pass','reg-password'],['toggle-confirm-pass','reg-confirm']].forEach(([btnId, inputId]) => {
    const btn = document.getElementById(btnId);
    const inp = document.getElementById(inputId);
    if (btn && inp) {
      btn.addEventListener('click', () => {
        const isText = inp.type === 'text';
        inp.type = isText ? 'password' : 'text';
        btn.querySelector('i').className = isText ? 'ri-eye-line' : 'ri-eye-off-line';
      });
    }
  });

  // Password strength meter
  const passInput = document.getElementById('reg-password');
  const strengthBar = document.getElementById('strength-bar');
  const strengthText = document.getElementById('strength-text');
  if (passInput) {
    passInput.addEventListener('input', () => {
      const val = passInput.value;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { width:'0%', color:'transparent', text:'At least 8 characters' },
        { width:'25%', color:'#e74c3c', text:'Weak' },
        { width:'50%', color:'#f39c12', text:'Fair' },
        { width:'75%', color:'#3498db', text:'Good' },
        { width:'100%', color:'#2ecc71', text:'Strong' }
      ];
      const level = levels[Math.min(score, 4)];
      if (strengthBar) { strengthBar.style.width = level.width; strengthBar.style.background = level.color; }
      if (strengthText) { strengthText.textContent = level.text; strengthText.style.color = level.color || 'var(--text-light)'; }
    });
  }
</script>
</body>
</html>
